name: Validate DSH upgrade
on:
  push:
    branches: [chore/plugin-compat-20261006]
    paths: [.github/workflows/compatibility-upgrade.yml, scripts/select-host.mjs]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.ref == 'refs/heads/chore/plugin-compat-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/plugin-compat-20261006
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update explicit prerelease compatibility and the shared core
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('package.json')
          d = json.loads(p.read_text())
          assert d['version'] == '0.1.0-alpha.5'
          d['version'] = '0.1.0-alpha.6'
          for section in ['dependencies', 'peerDependencies']:
              for name in d[section]:
                  if name.startswith('@deepseek-ai/dsh-'):
                      d[section][name] = '>=0.2.0-rc.2 || >=0.2.1-alpha.1'
          d['peerDependencies']['@deepseek-ai/cordis'] = '~4.0.4 || ~4.0.5-alpha.1'
          p.write_text(json.dumps(d, indent=2) + '\n')
          p = Path('README.md')
          s = p.read_text().replace('Version `0.1.0-alpha.5` is tested', 'Version `0.1.0-alpha.6` is tested')
          s = s.replace('`0.2.0-rc.2` and the current npm `latest`', '`0.2.0-rc.2`, `0.2.1-alpha.1` and the current npm `latest`')
          s = s.replace('All DSH service dependencies have a minimum compatible version and no upper bound.', 'DSH prereleases require explicit npm semver admission. The alpha host is tested with its matching service packages and Cordis peer; normal installation remains on the official latest tag. The DSH-native pi-ai dependency stays on the host-supported 0.87 line, independently of the standalone Pi extension.')
          p.write_text(s)
          PY
          git -C vendor/pi-lmm-provider fetch --depth=1 origin e38af2a4e96500b29c473a9f6395911bf8a9cb55
          git -C vendor/pi-lmm-provider checkout --detach FETCH_HEAD
          npm install --ignore-scripts --no-audit --no-fund
          npm install --global pnpm@latest
      - name: Validate the stable host
        run: |
          node scripts/select-host.mjs 0.2.0-rc.2
          npm run typecheck
          npm test
          npm run pack:check
          npm run test:host
      - name: Validate the new alpha host and shipped tarball
        run: |
          node scripts/select-host.mjs 0.2.1-alpha.1
          npm run typecheck
          npm test
          npm run pack:check
          npm run test:host
          archive=$(npm pack --ignore-scripts --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s)[0].filename))')
          LMM_DSH_PLUGIN="$PWD/$archive" npm run test:host
      - name: Commit verified source and lockfile only to the upgrade branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md vendor/pi-lmm-provider
          git commit -m 'fix: support DSH 0.2.1 alpha and update the shared Pi core'
          git push origin HEAD:refs/heads/chore/plugin-compat-20261006
