name: Verify DSH peer resolution
on:
  push:
    branches: [chore/plugin-compat-20261006]
    paths: [.github/workflows/fix-peer-resolution.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/chore/plugin-compat-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/plugin-compat-20261006
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reuse the host-owned DSH services instead of installing competing versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('package.json')
          d = json.loads(p.read_text())
          for name in ['@deepseek-ai/dsh-authorization', '@deepseek-ai/dsh-home-paths', '@deepseek-ai/dsh-llm-pi-ai']:
              d['peerDependencies'][name] = d['dependencies'].pop(name)
              d['devDependencies'][name] = '0.2.0-rc.2'
          for key in ['dependencies', 'peerDependencies', 'devDependencies']:
              d[key] = dict(sorted(d[key].items()))
          p.write_text(json.dumps(d, indent=2) + '\n')
          p = Path('test/package.test.ts')
          p.write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(new URL('../package.json', import.meta.url), 'utf8'));
          test('shared DSH services must be host-owned peers, not independently installed runtime dependencies', () => {
            for (const name of Object.keys(manifest.dependencies ?? {})) {
              assert.ok(!name.startsWith('@deepseek-ai/'), `Host-owned dependency ${name} must not shadow the active DSH runtime`);
            }
            for (const name of ['@deepseek-ai/dsh-authorization', '@deepseek-ai/dsh-home-paths', '@deepseek-ai/dsh-llm-pi-ai']) {
              assert.equal(manifest.peerDependencies[name], '>=0.2.0-rc.2 || >=0.2.1-alpha.1');
              assert.equal(manifest.devDependencies[name], '0.2.0-rc.2');
            }
          });
          ''')
          p = Path('README.md')
          s = p.read_text()
          s += '\n### Shared runtime dependency rule\n\nDSH authorization, home paths and pi-ai adapter packages are host-owned peer dependencies. Installing a second independently selected copy can shadow the active runtime and make stable DSH disable its authorization/model services. Development pins remain on the stable host, and the CI matrix verifies source plus tarball installation on each supported host. Do not use `allow-version` or disable the host compatibility checks to work around a dependency mismatch.\n'
          p.write_text(s)
          PY
          npm install --ignore-scripts --no-audit --no-fund
          npm install --global pnpm@latest
      - name: Test stable source and the exact shipped tarball
        run: |
          set -euo pipefail
          node scripts/select-host.mjs 0.2.0-rc.2
          npm run typecheck
          npm test
          npm run pack:check
          npm run test:host
          archive=$(npm pack --ignore-scripts --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s)[0].filename))')
          LMM_DSH_PLUGIN="$PWD/$archive" npm run test:host
      - name: Test alpha source and the exact shipped tarball
        run: |
          set -euo pipefail
          node scripts/select-host.mjs 0.2.1-alpha.1
          npm run typecheck
          npm test
          npm run pack:check
          npm run test:host
          archive=$(npm pack --ignore-scripts --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s)[0].filename))')
          LMM_DSH_PLUGIN="$PWD/$archive" npm run test:host
      - name: Commit only the fully tested dependency fix to this branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json test/package.test.ts README.md
          git commit -m 'fix: reuse host-owned DSH peers instead of shadowing stable services'
          git push origin HEAD:refs/heads/chore/plugin-compat-20261006
