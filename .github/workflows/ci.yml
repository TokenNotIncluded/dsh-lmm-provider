name: DSH provider compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [0.2.0-rc.2, 0.2.1-alpha.1, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global pnpm@latest
      - name: Align the complete service dependency set with the host
        run: node scripts/select-host.mjs '${{ matrix.host }}'
      - run: npm run typecheck && npm test && npm run pack:check
      - run: npm run test:host
      - name: Verify the shipped tarball on the actual host
        run: |
          set -euo pipefail
          archive=$(npm pack --ignore-scripts --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s)[0].filename))')
          LMM_DSH_PLUGIN="$PWD/$archive" npm run test:host
